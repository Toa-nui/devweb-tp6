<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <title>devweb-shortener</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    .count { font-size: 1.1em; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    input[type="url"] { width: 300px; padding: 8px; }
    button { padding: 8px 16px; background-color: #00d1b2; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #00b89c; }
    .result-box { display: none; background-color: #48c774; color: white; padding: 15px; text-align: center; font-weight: bold; margin-top: 20px; border-radius: 4px; }
    .result-box a { color: white; text-decoration: underline; }
    .copy-btn { display: none; margin: 10px auto 0 auto; background-color: #00d1b2; }
    .error-box { display: none; background-color: #f14668; color: white; padding: 10px; margin-top: 15px; border-radius: 4px; }
    .footer { margin-top: 40px; text-align: center; color: #7a7a7a; font-size: 0.9em; background: #f5f5f5; padding: 15px; }
  </style>
</head>
<body>
  <h1>devweb-shortener</h1>
  <div class="count" id="link-count">There are 0 links</div>

  <h2>Add a new link</h2>
  <form id="shorten-form">
    <div class="form-group">
      <label for="url">Type the URL to shorten </label>
      <input type="url" id="url" placeholder="https://perdu.com" required />
      <button type="submit">Submit</button>
    </div>
  </form>

  <div id="error-box" class="error-box"></div>
  <div id="result-box" class="result-box">
    <span id="short-url-link"></span>
  </div>
  <button id="copy-btn" class="copy-btn">✓ Copy</button>

  <div class="footer">
    devweb-shortener v0.1.0 see <a href="https://romulusfr.github.io/unc-s4-devweb/">https://romulusfr.github.io/unc-s4-devweb/</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
