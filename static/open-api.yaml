openapi: 3.0.0
info:
  title: API Shortener v2
  version: 2.0.0
paths:
  /api-v2/{short}:
    delete:
      summary: Supprime un lien précédemment créé
      parameters:
        - name: short
          in: path
          required: true
          schema:
            type: string
          description: Identifiant du lien raccourci
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Lien supprimé avec succès
        "401":
          description: En-tête X-API-Key manquant
        "403":
          description: Clé X-API-Key invalide
        "404":
          description: Lien non trouvé

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
